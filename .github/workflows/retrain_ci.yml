name: retrain_ci

on:
  workflow_dispatch:
  push:
    paths:
      - 'MLProject/**'
      - '.github/workflows/retrain_ci.yml'

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file:${{ github.workspace }}/MLProject/mlruns
      MLFLOW_EXPERIMENT_NAME: Tuning_Model_Churn
      HAS_DOCKERHUB_CREDENTIALS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 dagshub numpy pandas scikit-learn seaborn matplotlib

      - name: Retrain model with MLflow Project
        working-directory: MLProject
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
        run: mlflow run . -e main --env-manager=local

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-training-artifacts
          path: |
            MLProject/artifacts/**
            MLProject/mlruns/**

      - name: Log in to Docker Hub
        if: ${{ env.HAS_DOCKERHUB_CREDENTIALS == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image from MLflow model
        working-directory: MLProject
        run: |
          mlflow models build-docker -m artifacts/model -n albar19/msml-model:${{ github.sha }}

      - name: Push Docker image
        if: ${{ env.HAS_DOCKERHUB_CREDENTIALS == 'true' }}
        run: |
          docker push albar19/msml-model:${{ github.sha }}
