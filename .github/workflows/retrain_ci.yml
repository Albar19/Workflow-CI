name: Retrain Model CI/CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'MLProject/**'

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file:${{ github.workspace }}/MLProject/mlruns
      MLFLOW_EXPERIMENT_NAME: Tuning_Model_Churn

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Training Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 dagshub numpy pandas scikit-learn seaborn matplotlib

      - name: Retrain Model with MLflow Project
        working-directory: MLProject
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
        run: mlflow run . -e main --env-manager=local

      - name: Upload MLflow Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-training-artifacts
          path: |
            MLProject/artifacts/**
            MLProject/mlruns/**

      - name: Decode Docker Hub Token
        run: echo "DOCKER_TOKEN=$(echo 'ZGNrcl9wYXRfSm1CX1daTDJOYVZBRllpWkNBODM3NTg0NDJF' | base64 -d)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "albar19"
          password: "1904"

      - name: Build Docker Image from MLflow Model
        working-directory: MLProject
        run: |
          mlflow models build-docker -m artifacts/model -n albar19/msml-model:${{ github.sha }}

      - name: Tag Docker Image as Latest
        run: |
          docker tag albar19/msml-model:${{ github.sha }} albar19/msml-model:latest

      - name: Push Docker Image
        run: |
          docker push albar19/msml-model:${{ github.sha }}
          docker push albar19/msml-model:latest
